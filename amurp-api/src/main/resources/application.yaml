spring:
  application:
    name: amurp
  datasource:
    url: ${DB_AMURP_URL}
    username: ${DB_AMURP_USER}
    password: ${DB_AMURP_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true   # ajustar conforme a estratégia de baseline decidida
    baseline-version: 1         # definir com base no DDL exportado    
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-troque-antes-de-producao-32bytes}     # mínimo 32 caracteres; gere com: openssl rand -base64 48
    issuer: amurp
    expiration: 1h