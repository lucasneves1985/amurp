spring:
  application:
    name: amurp
  datasource:
    url: ${DB_AMURP_URL}
    username: ${DB_AMURP_USER}
    password: ${DB_AMURP_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: amurp
    expiration: 1h